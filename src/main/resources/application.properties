spring.application.name=n1-demo
spring.main.banner-mode=off

# In-memory H2; schema created from the entities at startup
spring.datasource.url=jdbc:h2:mem:library
spring.jpa.hibernate.ddl-auto=create-drop

# --- See the SQL that Hibernate sends ---------------------------------------
# Every SQL statement, through the logger (preferred over spring.jpa.show-sql,
# which writes to System.out and bypasses the logging configuration)
logging.level.org.hibernate.SQL=DEBUG
# The values bound to each "?" (Hibernate 6/7 category): shows the author_id changing
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# One line per statement makes the repetition easy to spot; set to true for readability
spring.jpa.properties.hibernate.format_sql=false

# --- Count the statements -----------------------------------------------------
# Enables Hibernate Statistics (used by DemoRunner) and logs, at the end of each
# session, "n JDBC statements executed"
spring.jpa.properties.hibernate.generate_statistics=true

# --- A fix without touching the queries: batch fetching ----------------------
# Uncomment, rerun, and compare scenarios 1, 4 and 6: 1 + 20 becomes 1 + ceil(20/10)
#spring.jpa.properties.hibernate.default_batch_fetch_size=10

logging.pattern.console=%clr(%-5level) %clr(%-30.30logger{29}){cyan} : %m%n
